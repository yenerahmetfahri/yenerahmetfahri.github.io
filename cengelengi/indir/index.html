<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çengelengi'yi indir</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Çengelengi: Bulmaca çöz, İngilizce öğren">
<meta property="og:description" content="Türkçe ipucunu oku, İngilizce kelimeyi bul. iPhone ve Android'de ücretsiz.">
<meta property="og:image" content="https://yenerahmetfahri.github.io/cengelengi/img/og.jpg">
<script>
  // Tek indirme bağlantısı (reklam, sosyal medya, QR): iPhone/iPad → App Store, Android → Google Play, diğerleri (bilgisayar)
  // → tanıtım sayfası. ?k=instagram gibi bir kaynak Play'e utm_source olarak, tanıtım sayfasına ?k= olarak geçer.
  // GitHub Pages sunucuda yönlendiremez; JS ile https mağaza adresine gidince tarayıcı mağazanın web sayfasını açıyor.
  // Bu yüzden önce mağaza uygulamasının kendi adresi (iOS itms-apps://, Android intent://), açılmazsa 1,5 sn sonra web adresi.
  (function () {
    var ua = navigator.userAgent;
    var k = new URLSearchParams(location.search).get('k') || '';
    if (!/^[A-Za-z0-9_-]{1,32}$/.test(k)) k = '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var PKG = 'com.yenerahmetfahri.bulmaca';
    var ref = k ? '&referrer=' + encodeURIComponent('utm_source=' + k + '&utm_medium=indir') : '';
    var app, web;
    if (ios) {
      app = 'itms-apps://apps.apple.com/tr/app/id6815218877';
      web = 'https://apps.apple.com/tr/app/id6815218877';
    } else if (/Android/.test(ua)) {
      web = 'https://play.google.com/store/apps/details?id=' + PKG + ref;
      app = 'intent://details?id=' + PKG + ref + '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url='
        + encodeURIComponent(web) + ';end';
    } else {
      location.replace('../' + (k ? '?k=' + k : ''));
      return;
    }
    location.href = app;
    setTimeout(function () { if (!document.hidden) location.replace(web); }, 1500);
  })();
</script>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; font: 800 17px system-ui, -apple-system, sans-serif;
  background: #59CC01; color: #fff; }
img.logo { width: 200px; margin: 0 auto 18px; display: block; }
.b { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.b img { height: 52px; }
a { color: #fff; }
</style>
</head>
<body>
<main>
  <img class="logo" src="../img/logo.png" alt="Çengelengi">
  <div>Mağazaya yönlendiriliyorsun…</div>
  <div class="b">
    <a href="https://apps.apple.com/tr/app/id6815218877"><img src="../img/app-store-tr.svg" alt="App Store'dan İndirin"></a>
    <a href="https://play.google.com/store/apps/details?id=com.yenerahmetfahri.bulmaca"><img src="../img/google-play-tr.png" alt="Google Play'den İndirin"></a>
  </div>
  <p><a href="../">Tanıtım sayfası</a></p>
</main>
</body>
</html>
