<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go On: Bulmaca ile İngilizce Öğren</title>
<meta name="description" content="Türkçe ipucunu oku, İngilizce kelimeyi bul. A1'den C2'ye çengel bulmaca ile İngilizce öğren. iPhone'da ücretsiz.">
<meta property="og:title" content="Go On: Bulmaca ile İngilizce Öğren">
<meta property="og:description" content="Türkçe ipucunu oku, İngilizce kelimeyi bul. Ezber değil, oyun gibi öğren.">
<meta property="og:image" content="https://yenerahmetfahri.github.io/go-on/1_bulmaca.jpg">
<meta name="apple-itunes-app" content="app-id=6815218877">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f6f3ff;--card:#fff;--text:#1f1b2e;--sub:#5d5873;--green:#58cc02;--greenD:#46a302}
@media (prefers-color-scheme:dark){:root{--bg:#16132a;--card:#221e3a;--text:#f2f0fa;--sub:#b3aecb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
.icon{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
h1{font-size:30px;margin:16px 0 4px}
.lead{font-size:18px;color:var(--sub);margin:0 0 20px;line-height:1.4}
.badge img{height:56px}
.badge{display:inline-block;transition:transform .15s}
.badge:active{transform:scale(.96)}
ul{list-style:none;padding:0;margin:24px auto;max-width:360px;text-align:left;font-size:17px;line-height:1.9}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 16px;margin:0 -16px;padding-left:16px}
.shots img{width:62%;max-width:240px;flex:none;border-radius:20px;scroll-snap-align:center;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.note{color:var(--sub);font-size:14px;margin-top:28px}
.note a{color:var(--sub)}
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Go On simgesi">
  <h1>Go On</h1>
  <p class="lead">Türkçe ipucunu oku, İngilizce kelimeyi bul.<br>Ezber değil, oyun gibi öğren.</p>
  <a class="badge" href="https://apps.apple.com/tr/app/go-on-bulmaca/id6815218877"><img src="app-store.svg" alt="App Store'dan indirin"></a>
  <ul>
    <li>✨ A1'den C2'ye 5 seviye</li>
    <li>🔊 Telaffuz</li>
    <li>📓 Kelime defteri ve tekrar</li>
    <li>🔥 Günlük seri, haftalık lig</li>
    <li>👯 Arkadaşlarınla yarış</li>
  </ul>
  <div class="shots">
    <img src="1_bulmaca.jpg" alt="Çengel bulmaca ekranı">
    <img src="2_tebrik.jpg" alt="Bulmaca bitti, tebrik ekranı">
    <img src="4_yol.jpg" alt="Seviye yolu">
  </div>
  <a class="badge" href="https://apps.apple.com/tr/app/go-on-bulmaca/id6815218877"><img src="app-store.svg" alt="App Store'dan indirin"></a>
  <p class="note">iPhone'da ücretsiz · <a href="../bulmaca-gizlilik/">Gizlilik</a></p>
</main>
</body>
</html>
